<!DOCTYPE html> 
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彥彬📿 祭改系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }
        body {
            background: #0F0F0F;
            background-image: radial-gradient(circle at 50% 10%, rgba(44,28,20,0.3) 0%, transparent 35%),
                              radial-gradient(circle at 80% 80%, rgba(30,20,15,0.4) 0%, transparent 40%);
            margin: 0;
            padding: 18px;
            max-width: 600px;
            margin: auto;
            position: relative;
            min-height: 100vh;
        }

        .header-card {
            position: relative;
            padding: 32px 20px;
            background: linear-gradient(155deg, #2D2420, #1C1612);
            color: #E0CFC0;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .header-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(224,207,192,0.2), transparent);
        }

        .admin-vertical-btn {
            position: absolute !important;
            right: 20px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            background: linear-gradient(135deg, #5C3A37, #4A2C2A) !important;
            color: #E0CFC0 !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 6px 10px !important;
            font-size: 14px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.06), 0 0 12px rgba(224,207,192,0.6) !important;
            z-index: 10 !important;
            white-space: normal !important;
            line-height: 1.3 !important;
            text-align: center !important;
            width: auto !important;
            min-width: unset !important;
            max-width: fit-content !important;
            display: none;
            transition: all 0.25s ease !important;
            letter-spacing: 0 !important;
        }
        .admin-vertical-btn:hover {
            transform: translateY(-50%) scale(1.05) !important;
            box-shadow: 0 3px 10px rgba(0,0,0,0.35), 0 0 16px rgba(224,207,192,0.7) !important;
        }

        .card {
            background: linear-gradient(140deg, #1E1A18, #181411);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
            border: none;
        }
        h2 {
            color: #E0CFC0;
            text-align: center;
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        .title {
            color: #D4B59E;
            font-weight: bold;
            margin-bottom: 14px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        input[type="text"], input:not([type="checkbox"]):not([type="number"]) {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            font-size: 16px;
            margin-bottom: 14px;
            background: rgba(30,26,24,0.6);
            color: #E0E0E0;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        input[type="text"]:focus, input:not([type="checkbox"]):not([type="number"]):focus {
            outline: none;
            border-color: rgba(160,82,77,0.4);
            background: rgba(36,30,28,0.8);
            box-shadow: 0 0 0 3px rgba(160,82,77,0.15);
        }
        input::placeholder {
            color: #777777;
        }

        .collapse-btn {
            background: none;
            border: none;
            color: #D4B59E;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .collapse-btn:hover { color: #E0CFC0; }

        .collapse-content {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.55s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .collapse-content.open { max-height: 2000px; }

        /* ===== 族群分類區塊 ===== */
        .group-block {
            margin-bottom: 14px;
        }
        .group-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #A08070;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0 2px;
            margin-bottom: 8px;
            margin-top: 6px;
        }
        .group-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(160,128,112,0.3), transparent);
        }

        /* 族群色系 */
        .group-block[data-group="財運"] .item-row.checked { border-color: rgba(255,200,50,0.45); background: rgba(50,42,15,0.75); }
        .group-block[data-group="財運"] .group-label { color: #C8A840; }
        .group-block[data-group="財運"] .group-label::after { background: linear-gradient(90deg, rgba(200,168,64,0.3), transparent); }

        .group-block[data-group="靈煞"] .item-row.checked { border-color: rgba(160,82,200,0.45); background: rgba(40,20,55,0.75); }
        .group-block[data-group="靈煞"] .group-label { color: #A882C8; }
        .group-block[data-group="靈煞"] .group-label::after { background: linear-gradient(90deg, rgba(168,130,200,0.3), transparent); }

        .group-block[data-group="運勢"] .item-row.checked { border-color: rgba(80,160,220,0.45); background: rgba(15,35,55,0.75); }
        .group-block[data-group="運勢"] .group-label { color: #6AABCC; }
        .group-block[data-group="運勢"] .group-label::after { background: linear-gradient(90deg, rgba(106,171,204,0.3), transparent); }

        .group-block[data-group="其他"] .item-row.checked { border-color: rgba(160,82,77,0.5); background: rgba(50,28,26,0.75); }
        .group-block[data-group="其他"] .group-label { color: #A0524D; }
        .group-block[data-group="其他"] .group-label::after { background: linear-gradient(90deg, rgba(160,82,77,0.3), transparent); }

        /* ===== 項目列（一行一列）===== */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .item-row {
            background: rgba(30,26,24,0.7);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            padding: 11px 14px;
            gap: 10px;
            transition: all 0.22s ease;
            backdrop-filter: blur(4px);
            width: 100%;
        }
        .item-row:hover {
            background: rgba(44,32,30,0.8);
            border-color: rgba(160,82,77,0.3);
            transform: translateX(2px);
        }
        .item-row input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin: 0;
            flex-shrink: 0;
            accent-color: #A0524D;
            cursor: pointer;
        }
        .item-label {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            color: #E0E0E0;
            cursor: pointer;
            user-select: none;
            line-height: 1;
        }
        .item-emoji {
            font-size: 18px;
            flex-shrink: 0;
            width: 26px;
            text-align: center;
        }

        /* 份數控制器 */
        .qty-control {
            display: flex;
            align-items: center;
            gap: 0;
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .qty-control.active {
            opacity: 1;
            pointer-events: all;
        }
        .qty-btn {
            width: 30px !important;
            height: 30px !important;
            padding: 0 !important;
            border-radius: 8px !important;
            font-size: 17px !important;
            font-weight: bold;
            background: linear-gradient(135deg, #5C3A37, #4A2C2A) !important;
            color: #E0CFC0 !important;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;
            line-height: 1;
            transition: all 0.15s;
            min-width: unset !important;
            letter-spacing: 0;
        }
        .qty-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #B86B5F, #A0524D) !important;
            transform: scale(1.12) !important;
        }
        .qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .qty-display {
            min-width: 32px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #FFE44D;
            padding: 0 3px;
            line-height: 30px;
        }
        .qty-unit {
            font-size: 12px;
            color: #A08070;
            margin-left: 1px;
        }

        #customItem {
            margin-top: 10px;
            display: none;
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(30,26,24,0.6);
            color: #E0E0E0;
        }
        #customItem:focus {
            outline: none;
            border-color: rgba(160,82,77,0.4);
        }

        #submitBtn { margin-top: 24px; }

        button {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #B86B5F, #A0524D);
            color: #FFF;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(160,82,77,0.25), 0 0 15px rgba(184, 107, 95, 0.6);
            letter-spacing: 0.5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(160,82,77,0.35), 0 0 15px rgba(184, 107, 95, 0.6);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        button.secondary {
            background: linear-gradient(135deg, #4A6A8C, #3D5A73);
            box-shadow: 0 4px 15px rgba(61,90,115,0.2), 0 0 12px rgba(74, 106, 140, 0.5);
        }
        button.secondary:hover {
            box-shadow: 0 6px 20px rgba(61,90,115,0.28), 0 0 12px rgba(74, 106, 140, 0.5);
        }

        .msg {
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            margin: 14px 0;
            display: none;
            font-weight: bold;
            backdrop-filter: blur(6px);
        }
        .msg.success {
            background: rgba(27,59,41,0.8);
            color: #A8E6CF;
            border: 1px solid rgba(168,230,207,0.15);
        }
        .msg.error {
            background: rgba(59,33,33,0.8);
            color: #FFB3B3;
            border: 1px solid rgba(255,179,179,0.15);
        }

        .list {
            margin-top: 12px;
            overflow: hidden;
            color: #ffffff;
            padding-right: 4px;
        }
        .item {
            padding: 14px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 16px;
            transition: 0.2s;
        }
        .item:hover { background: rgba(255,255,255,0.03); }
        .name {
            color: #FFE44D;
            font-weight: bold;
            font-size: 17px;
        }
        .itemText { color: #8AB4F8; }

        /* ===== 項目統計區 ===== */
        /* ===== 統計卡主體 ===== */
        .stats-card {
            background: linear-gradient(140deg, #1A1714, #131110);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }

        /* 總覽列：人數 + 份數 */
        .stats-overview {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stats-overview-item {
            flex: 1;
            background: rgba(20,18,16,0.9);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .overview-label {
            font-size: 11px;
            color: #888;
            letter-spacing: 0.5px;
        }
        .overview-num {
            font-size: 32px;
            font-weight: 900;
            color: #FFE44D;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .overview-unit {
            font-size: 11px;
            color: #666;
        }

        /* 族群色塊 */
        .stat-group {
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        .stat-group::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
        }
        .stat-group[data-g="財運"] {
            background: linear-gradient(135deg, rgba(61,48,16,0.9), rgba(40,32,10,0.9));
            border: 1px solid rgba(200,168,64,0.25);
        }
        .stat-group[data-g="靈煞"] {
            background: linear-gradient(135deg, rgba(42,16,64,0.9), rgba(28,10,45,0.9));
            border: 1px solid rgba(136,85,187,0.25);
        }
        .stat-group[data-g="運勢"] {
            background: linear-gradient(135deg, rgba(10,32,53,0.9), rgba(6,20,36,0.9));
            border: 1px solid rgba(68,136,187,0.25);
        }
        .stat-group[data-g="其他"] {
            background: linear-gradient(135deg, rgba(42,21,16,0.9), rgba(28,14,10,0.9));
            border: 1px solid rgba(160,80,48,0.25);
        }

        /* 族群標題列 */
        .stat-group-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .stat-group-bar {
            width: 3px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .stat-group[data-g="財運"] .stat-group-bar { background: #C8A840; }
        .stat-group[data-g="靈煞"] .stat-group-bar { background: #8855BB; }
        .stat-group[data-g="運勢"] .stat-group-bar { background: #4488BB; }
        .stat-group[data-g="其他"] .stat-group-bar { background: #A05030; }

        .stat-group-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .stat-group[data-g="財運"] .stat-group-label { color: #C8A840; }
        .stat-group[data-g="靈煞"] .stat-group-label { color: #A882C8; }
        .stat-group[data-g="運勢"] .stat-group-label { color: #6AABCC; }
        .stat-group[data-g="其他"] .stat-group-label { color: #C07050; }

        .stat-group-divider {
            flex: 1;
            height: 1px;
            opacity: 0.25;
        }
        .stat-group[data-g="財運"] .stat-group-divider { background: #C8A840; }
        .stat-group[data-g="靈煞"] .stat-group-divider { background: #8855BB; }
        .stat-group[data-g="運勢"] .stat-group-divider { background: #4488BB; }
        .stat-group[data-g="其他"] .stat-group-divider { background: #A05030; }

        /* 每項：一行，左名稱右份數 */
        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-row-name {
            font-size: 15px;
            font-weight: 500;
            color: #E0E0E0;
        }
        .stat-row-right {
            display: flex;
            align-items: baseline;
            gap: 3px;
        }
        .stat-row-count {
            font-size: 22px;
            font-weight: 800;
            color: #FFE44D;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .stat-row-unit {
            font-size: 12px;
            color: #888;
        }

        .admin-row {
            display: flex;
            margin-top: 10px;
            gap: 8px;
            justify-content: flex-start;
        }
        .admin-row button {
            padding: 5px 10px !important;
            font-size: 14px !important;
            width: fit-content !important;
            flex: unset !important;
            border-radius: 8px;
            white-space: nowrap;
            font-weight: normal;
            transition: all 0.2s ease;
        }
        .admin-row button:hover { transform: scale(1.03); }

        /* ===== Modal 基礎 ===== */
        .modal {
            display: none !important;
            position: fixed !important;
            z-index: 9999 !important;
            left: 0 !important; top: 0 !important;
            width: 100% !important; height: 100% !important;
            background-color: rgba(0,0,0,0.88) !important;
            align-items: center !important;
            justify-content: center !important;
            backdrop-filter: blur(8px) !important;
            padding: 16px !important;
        }
        .modal.show { display: flex !important; }
        .modal-content {
            background: linear-gradient(160deg, #201C19, #161210) !important;
            color: #E0E0E0 !important;
            margin: auto !important;
            padding: 0 !important;
            border-radius: 24px !important;
            width: 100% !important;
            max-width: 420px !important;
            max-height: 88vh !important;
            overflow-y: auto !important;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.07) !important;
            position: relative !important;
        }

        /* ===== 管理員彈窗內部元件 ===== */
        .adm-header {
            padding: 22px 24px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .adm-header-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #5C3A37, #3A2220);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .adm-header-title {
            font-size: 17px; font-weight: bold;
            color: #E0CFC0; letter-spacing: 0.3px;
        }
        .adm-header-sub {
            font-size: 12px; color: #888; margin-top: 2px;
        }
        .adm-close-btn {
            margin-left: auto;
            background: rgba(255,255,255,0.06) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 8px !important;
            width: 32px !important; height: 32px !important;
            padding: 0 !important;
            font-size: 18px !important;
            color: #888 !important;
            cursor: pointer !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            box-shadow: none !important;
            letter-spacing: 0 !important;
            transition: all 0.15s !important;
            flex-shrink: 0 !important;
            line-height: 1 !important;
        }
        .adm-close-btn:hover {
            background: rgba(255,255,255,0.1) !important;
            color: #E0E0E0 !important;
            transform: none !important;
        }

        .adm-body { padding: 16px 20px 20px; }

        /* 功能按鈕群 */
        .adm-btn-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .adm-btn {
            width: 100% !important;
            padding: 13px 16px !important;
            border-radius: 14px !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            display: flex !important; align-items: center !important; gap: 10px !important;
            text-align: left !important;
            border: 1px solid transparent !important;
            transition: all 0.2s !important;
            letter-spacing: 0 !important;
            box-shadow: none !important;
        }
        .adm-btn-icon {
            font-size: 18px; flex-shrink: 0;
            width: 28px; text-align: center;
        }
        .adm-btn-text { flex: 1; }
        .adm-btn-sub { font-size: 11px; font-weight: 400; opacity: 0.6; display: block; margin-top: 1px; }
        .adm-btn-arrow { font-size: 14px; color: rgba(255,255,255,0.3); flex-shrink: 0; }

        .adm-btn.blue {
            background: linear-gradient(135deg, rgba(46,109,164,0.25), rgba(24,70,120,0.2)) !important;
            border-color: rgba(46,109,164,0.35) !important;
            color: #90C8F0 !important;
        }
        .adm-btn.blue:hover {
            background: linear-gradient(135deg, rgba(46,109,164,0.4), rgba(24,70,120,0.35)) !important;
            transform: translateY(-1px) !important;
        }
        .adm-btn.gold {
            background: linear-gradient(135deg, rgba(184,134,11,0.2), rgba(120,88,8,0.2)) !important;
            border-color: rgba(184,134,11,0.3) !important;
            color: #E8C060 !important;
        }
        .adm-btn.gold:hover {
            background: linear-gradient(135deg, rgba(184,134,11,0.35), rgba(120,88,8,0.3)) !important;
            transform: translateY(-1px) !important;
        }
        .adm-btn.red {
            background: linear-gradient(135deg, rgba(180,40,50,0.2), rgba(120,20,30,0.2)) !important;
            border-color: rgba(180,40,50,0.3) !important;
            color: #F08090 !important;
        }
        .adm-btn.red:hover {
            background: linear-gradient(135deg, rgba(180,40,50,0.35), rgba(120,20,30,0.3)) !important;
            transform: translateY(-1px) !important;
        }

        /* 分隔線 */
        .adm-divider {
            height: 1px;
            background: rgba(255,255,255,0.07);
            margin: 4px 0 16px;
        }

        /* 管理員名單區 */
        .adm-section-title {
            font-size: 11px; font-weight: bold;

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwWIZ3ID5K9PNgSJ20wwMZOiMIQ4dcDGm8M8FIU-u8sRqrzGdomM74OEREGPt2Fgxz8Og/exec";
    
    // ===== 族群分類定義 =====
    const WISH_GROUPS = [
        {
            id: "財運",
            label: "🪙 財運類",
            items: [
                { name: "補財庫", emoji: "💰" }
            ]
        },
        {
            id: "靈煞",
            label: "🕯️ 靈煞類",
            items: [
                { name: "冤親債主", emoji: "👻" },
                { name: "歷代祖先", emoji: "🏮" },
                { name: "嬰靈",     emoji: "🌸" }
            ]
        },
        {
            id: "運勢",
            label: "🌟 運勢類",
            items: [
                { name: "病符", emoji: "🩺" },
                { name: "車關",  emoji: "🚗" },
                { name: "倒房",  emoji: "🏠" }
            ]
        },
        {
            id: "其他",
            label: "✍️ 其他",
            items: [
                { name: "其他", emoji: "📝" }
            ]
        }
    ];

    // 全部 WISH_ITEMS（扁平化，供其他函式使用）
    const WISH_ITEMS = WISH_GROUPS.flatMap(g => g.items.map(i => i.name));

    let currentUserId = "";
    let currentDisplayName = "";
    let allRecords = [];
    let isAdminUser = false;

    let currentPage = 1;
    const recordsPerPage = 7;
    let totalPages = 1;
    let filteredRecords = [];

    let mCurrentPage = 1;
    const mRecordsPerPage = 4;
    let mTotalPages = 1;
    let mFilteredRecords = [];
    let mAllRecords = [];

    const itemQty = {};

    window.onload = async function () {
        buildItemRows();
        await initLiffAndGetUser();
        await loadList();
    };

    // ===== 建立族群分類項目列 =====
    function buildItemRows() {
        const container = document.getElementById("items");
        container.innerHTML = "";

        WISH_GROUPS.forEach(group => {
            const block = document.createElement("div");
            block.className = "group-block";
            block.dataset.group = group.id;

            // 族群標籤
            const groupLabel = document.createElement("div");
            groupLabel.className = "group-label";
            groupLabel.textContent = group.label;
            block.appendChild(groupLabel);

            // 項目列表
            const cbGroup = document.createElement("div");
            cbGroup.className = "checkbox-group";

            group.items.forEach(itemDef => {
                const itemName = itemDef.name;
                itemQty[itemName] = 1;

                const row = document.createElement("div");
                row.className = "item-row";
                row.dataset.item = itemName;

                // emoji
                const emojiSpan = document.createElement("span");
                emojiSpan.className = "item-emoji";
                emojiSpan.textContent = itemDef.emoji;

                // 勾選框
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.value = itemName;
                cb.id = `cb_${itemName}`;

                // 標籤
                const lbl = document.createElement("label");
                lbl.className = "item-label";
                lbl.htmlFor = `cb_${itemName}`;
                lbl.textContent = itemName;

                // 份數控制器
                const qtyCtrl = document.createElement("div");
                qtyCtrl.className = "qty-control";
                qtyCtrl.id = `qty_${itemName}`;

                const minusBtn = document.createElement("button");
                minusBtn.className = "qty-btn";
                minusBtn.textContent = "－";
                minusBtn.type = "button";
                minusBtn.onclick = (e) => { e.stopPropagation(); changeQty(itemName, -1); };

                const display = document.createElement("div");
                display.className = "qty-display";
                display.id = `qd_${itemName}`;
                display.textContent = "1";

                const plusBtn = document.createElement("button");
                plusBtn.className = "qty-btn";
                plusBtn.textContent = "＋";
                plusBtn.type = "button";
                plusBtn.onclick = (e) => { e.stopPropagation(); changeQty(itemName, 1); };

                const unit = document.createElement("span");
                unit.className = "qty-unit";
                unit.textContent = "份";

                qtyCtrl.appendChild(minusBtn);
                qtyCtrl.appendChild(display);
                qtyCtrl.appendChild(plusBtn);
                qtyCtrl.appendChild(unit);

                row.appendChild(emojiSpan);
                row.appendChild(cb);
                row.appendChild(lbl);
                row.appendChild(qtyCtrl);

                cb.addEventListener("change", function () {
                    row.classList.toggle("checked", this.checked);
                    qtyCtrl.classList.toggle("active", this.checked);
                    if (itemName === "其他") {
                        document.getElementById("customItem").style.display = this.checked ? "block" : "none";
                    }
                });

                cbGroup.appendChild(row);
            });

            block.appendChild(cbGroup);
            container.appendChild(block);
        });
    }

    function changeQty(itemName, delta) {
        itemQty[itemName] = Math.max(1, Math.min(99, (itemQty[itemName] || 1) + delta));
        document.getElementById(`qd_${itemName}`).textContent = itemQty[itemName];
    }

    async function initLiffAndGetUser() {
        try {
            await liff.init({ liffId: "2007416974-JzvPy6DZ" });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const p = await liff.getProfile();
            currentUserId = p.userId || "unknown_user";
            currentDisplayName = p.displayName || "unknown_name";
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ mode: "checkAdmin", userId: currentUserId })
            });
            const data = await res.json();
            isAdminUser = data.isAdmin || false;
            if (isAdminUser) document.getElementById("adminBtn").style.display = "block";
        } catch (e) {
            currentUserId = "error_user";
            currentDisplayName = "error_name";
            isAdminUser = false;
        }
    }

    function toggleCollapse() {
        const content = document.getElementById("collapseContent");
        const btn = document.querySelector(".collapse-btn");
        if (content.classList.contains("open")) {
            content.classList.remove("open");
            btn.innerText = "展開：▶";
        } else {
            content.classList.add("open");
            btn.innerText = "收合：▼";
        }
    }

    function getSignDate() {
        const now = new Date();
        return `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
    }

    function getFullDateTime() {
        const now = new Date();
        let h = now.getHours();
        const m = now.getMinutes(), s = now.getSeconds();
        const p = h >= 12 ? "下午" : "上午";
        if (h > 12) h -= 12;
        if (h === 0) h = 12;
        return `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${p} ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function isUserAlreadySigned(name) {
        return allRecords.some(row => row[0]?.trim() === name.trim() && row[2] === currentUserId);
    }

    async function submitSignup() {
        const btn = document.getElementById("submitBtn");
        const name = document.getElementById("name").value.trim();
        const custom = document.getElementById("customItem").value.trim();
        const checks = document.querySelectorAll(".checkbox-group input[type='checkbox']:checked");

        btn.disabled = true;
        btn.innerText = "⏳ 提交中...";
        showMsg("⏳ 報名中，請稍候…", true);

        let items = Array.from(checks).map(c => c.value);
        const hasOther = items.includes("其他");

        if (hasOther) {
            items = items.filter(i => i !== "其他");
            if (!custom) {
                showMsg("請輸入其他項目", false);
                btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
            }
        }

        if (!name) {
            showMsg("請輸入姓名", false);
            btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
        }
        if (items.length === 0 && !hasOther) {
            showMsg("請選擇項目", false);
            btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
        }
        if (isUserAlreadySigned(name)) {
            showMsg("❌\n此姓名報名過，\n無法重複報名", false);
            btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
        }

        let itemParts = items.map(i => {
            const qty = itemQty[i] || 1;
            return qty > 1 ? `${i}×${qty}` : i;
        });
        if (hasOther) {
            const qty = itemQty["其他"] || 1;
            itemParts.push(qty > 1 ? `${custom}×${qty}` : custom);
        }

        try {
            const form = new URLSearchParams();
            form.append("name", name);
            form.append("item", itemParts.join("、"));
            form.append("userId", currentUserId);
            form.append("displayName", currentDisplayName);
            form.append("signDate", getSignDate());
            form.append("submitTime", getFullDateTime());

            const res = await fetch(WEB_APP_URL, { method: "POST", body: form });
            const data = await res.json();

            if (data.success) {
                showMsg("✅ 報名成功", true);
                document.getElementById("name").value = "";
                document.getElementById("customItem").value = "";
                document.querySelectorAll(".checkbox-group input[type='checkbox']").forEach(c => {
                    c.checked = false;
                    const row = c.closest(".item-row");
                    if (row) row.classList.remove("checked");
                    const ctrl = document.getElementById(`qty_${c.value}`);
                    if (ctrl) ctrl.classList.remove("active");
                    itemQty[c.value] = 1;
                    const disp = document.getElementById(`qd_${c.value}`);
                    if (disp) disp.textContent = "1";
                });
                document.getElementById("customItem").style.display = "none";
                await loadList();
            } else {
                showMsg("❌ 失敗：" + (data.message || ""), false);
            }
        } catch (err) {
            showMsg("❌ 連線異常", false);
        } finally {
            btn.disabled = false;
            btn.innerText = "✅ 送出報名";
        }
    }

    async function loadList() {
        try {
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ mode: "read" })
            });
            const data = await res.json();
            if (!data.success || data.records.length === 0) {
                document.getElementById("list").innerHTML = "目前無報名資料";
                allRecords = []; filteredRecords = [];
                updatePagination();
                renderStats([]);
                return;
            }
            allRecords = data.records;
            allRecords.reverse();
            filteredRecords = [...allRecords];
            currentPage = 1;
            updatePagination();
            renderCurrentPage();
            renderStats(allRecords);
        } catch (err) {
            document.getElementById("list").innerHTML = "目前無報名資料";
            allRecords = []; filteredRecords = [];
            updatePagination();
            renderStats([]);
        }
    }

    function parseItemsFromString(str) {
        const parts = str.split(/[、,，]/);
        const result = [];
        parts.forEach(p => {
            p = p.trim();
            if (!p) return;
            const match = p.match(/^(.+?)[\u00D7\uFF38xX*](\d+)$/);
            if (match) {
                result.push({ name: match[1].trim(), qty: parseInt(match[2], 10) || 1 });
            } else {
                result.push({ name: p, qty: 1 });
            }
        });
        return result;
    }

    // ===== 族群分類定義（統計用，與 WISH_GROUPS 對應）=====
    const STAT_GROUPS = [
        { id: "財運", label: "🪙 財運類", items: ["補財庫"] },
        { id: "靈煞", label: "🕯️ 靈煞類", items: ["冤親債主", "歷代祖先", "嬰靈"] },
        { id: "運勢", label: "🌟 運勢類", items: ["病符", "車關", "倒房"] }
    ];
    const ALL_KNOWN_ITEMS = STAT_GROUPS.flatMap(g => g.items);

    // ===== 前綴比對（支援「冤親債主（累世）」等備註格式）=====
    function resolveStatGroup(rawName) {
        for (const g of STAT_GROUPS) {
            for (const kw of g.items) {
                if (rawName.startsWith(kw)) return { groupId: g.id, stdName: kw };
            }
        }
        return null;
    }

    function renderStats(records) {
        const statsCard = document.getElementById("statsCard");

        if (!records || records.length === 0) {
            statsCard.style.display = "none";
            return;
        }

        // ── 統計（前綴比對歸類）
        const groupCounter = {};   // stdName → qty（歸入標準族群）
        const otherCounter = {};   // rawName → qty（無法歸類）
        const nameSet = new Set();
        let totalQty = 0;

        records.forEach(row => {
            const personName = (row[0] || "").trim();
            const itemStr = (row[1] || "").trim();
            if (!personName || !itemStr) return;
            nameSet.add(personName);

            parseItemsFromString(itemStr).forEach(({ name: rawName, qty }) => {
                if (!rawName) return;
                totalQty += qty;
                const resolved = resolveStatGroup(rawName);
                if (resolved) {
                    groupCounter[resolved.stdName] = (groupCounter[resolved.stdName] || 0) + qty;
                } else {
                    otherCounter[rawName] = (otherCounter[rawName] || 0) + qty;
                }
            });
        });

        const hasData = Object.keys(groupCounter).length > 0 || Object.keys(otherCounter).length > 0;
        if (!hasData) {
            statsCard.style.display = "none";
            return;
        }

        statsCard.style.display = "block";

        // ── 更新總覽
        document.getElementById("statsPeople").textContent = nameSet.size;
        document.getElementById("statsTotal").textContent = totalQty;

        // ── 渲染族群分類區塊
        const groupsEl = document.getElementById("statsGroups");
        let html = "";

        STAT_GROUPS.forEach(group => {
            const rows = group.items
                .filter(itemName => groupCounter[itemName])
                .map(itemName => ({ name: itemName, qty: groupCounter[itemName] }));
            if (rows.length === 0) return;

            html += `<div class="stat-group" data-g="${group.id}">
                <div class="stat-group-header">
                    <div class="stat-group-bar"></div>
                    <div class="stat-group-label">${group.label}</div>
                    <div class="stat-group-divider"></div>
                </div>
                ${rows.map(({ name, qty }) => `
                <div class="stat-row">
                    <div class="stat-row-name">${name}</div>
                    <div class="stat-row-right">
                        <div class="stat-row-count">${qty}</div>
                        <div class="stat-row-unit">份</div>
                    </div>
                </div>`).join("")}
            </div>`;
        });

        // 其他
        const otherEntries = Object.entries(otherCounter);
        if (otherEntries.length > 0) {
            html += `<div class="stat-group" data-g="其他">
                <div class="stat-group-header">
                    <div class="stat-group-bar"></div>
                    <div class="stat-group-label">✍️ 其他</div>
                    <div class="stat-group-divider"></div>
                </div>
                ${otherEntries.map(([name, qty]) => `
                <div class="stat-row">
                    <div class="stat-row-name">${name}</div>
                    <div class="stat-row-right">
                        <div class="stat-row-count">${qty}</div>
                        <div class="stat-row-unit">份</div>
                    </div>
                </div>`).join("")}
            </div>`;
        }

        groupsEl.innerHTML = html;
    }

    function renderCurrentPage() {
        const start = (currentPage - 1) * recordsPerPage;
        renderList(filteredRecords.slice(start, start + recordsPerPage));
    }
    function updatePagination() {
        totalPages = Math.ceil(filteredRecords.length / recordsPerPage);
        const el = document.getElementById("pagination");
        if (filteredRecords.length === 0) { el.style.display = "none"; return; }
        el.style.display = "flex";
        document.getElementById("pageInfo").innerText = `${currentPage} / ${totalPages}`;
        document.getElementById("firstPage").disabled = currentPage === 1;
        document.getElementById("prevPage").disabled = currentPage === 1;
        document.getElementById("nextPage").disabled = currentPage === totalPages;
        document.getElementById("lastPage").disabled = currentPage === totalPages;
    }
    function changePage(d) {
        currentPage = Math.max(1, Math.min(currentPage + d, totalPages));
        renderCurrentPage(); updatePagination();
    }
    function goToPage(p) {
        currentPage = Math.max(1, Math.min(p, totalPages));
        renderCurrentPage(); updatePagination();
    }

    function renderList(records) {
        document.getElementById("list").innerHTML = records.length
            ? records.map(row => `
                <div class="item">
                    <span class="name">${row[0] || ""}</span>
                    <span class="itemText">：${row[1] || ""}</span>
                </div>`).join("")
            : "目前無報名資料";
    }

    function searchList() {
        const kw = document.getElementById("searchInput").value.trim().toLowerCase();
        filteredRecords = kw
            ? allRecords.filter(r => (r[0]||"").toLowerCase().includes(kw) || (r[1]||"").toLowerCase().includes(kw))
            : [...allRecords];
        currentPage = 1; updatePagination(); renderCurrentPage();
    }

    function openModal() {
        document.getElementById("adminModal").classList.add("show");
        loadAdminList();
    }
    function closeModal() {
        document.getElementById("adminModal").classList.remove("show");
    }

    // ===== 管理員名單 =====
    async function loadAdminList() {
        const listEl = document.getElementById("adminList");
        listEl.innerHTML = '<div class="adm-list-empty">載入中...</div>';
        try {
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ mode: "getAdminList", userId: currentUserId })
            });
            const data = await res.json();
            if (!data.success || !data.admins || data.admins.length === 0) {
                listEl.innerHTML = '<div class="adm-list-empty">目前無管理員資料</div>';
                return;
            }
            listEl.innerHTML = data.admins.map((a, i) => `
                <div class="adm-list-item">
                    <div class="adm-list-avatar">${(a.name || "管")[0]}</div>
                    <div style="flex:1; min-width:0;">
                        <div class="adm-list-name">${a.name || "管理員"}</div>
                        <div class="adm-list-id">${(a.userId || "").slice(0, 20)}...</div>
                    </div>
                    <button class="adm-list-del" onclick="removeAdmin('${a.userId || ""}', '${(a.name || "").replace(/'/g, "")}')" title="移除管理員">✕</button>
                </div>
            `).join("");
        } catch (e) {
            listEl.innerHTML = '<div class="adm-list-empty">載入失敗</div>';
        }
    }

    async function addAdmin() {
        const input = document.getElementById("newAdminId");
        const newId = input.value.trim();
        if (!newId || !newId.startsWith("U")) {
            showMsg("❌ 請輸入正確的 LINE userId（U開頭）", false); return;
        }
        try {
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ mode: "addAdmin", userId: currentUserId, newAdminId: newId })
            });
            const data = await res.json();
            if (data.success) {
                showMsg("✅ 已新增管理員", true);
                input.value = "";
                loadAdminList();
            } else {
                showMsg("❌ " + (data.message || "新增失敗"), false);
            }
        } catch (e) {
            showMsg("❌ 連線異常", false);
        }
    }

    async function removeAdmin(removeId, removeName) {
        if (!confirm(`⚠️ 確定移除管理員「${removeName}」？`)) return;
        if (removeId === currentUserId) {
            showMsg("❌ 不能移除自己", false); return;
        }
        try {
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ mode: "removeAdmin", userId: currentUserId, removeAdminId: removeId })
            });
            const data = await res.json();
            if (data.success) {
                showMsg("✅ 已移除管理員", true);
                loadAdminList();
            } else {
                showMsg("❌ " + (data.message || "移除失敗"), false);
            }
        } catch (e) {
            showMsg("❌ 連線異常", false);
        }
    }

    function openListManager() {
        if (!isAdminUser) { showMsg("❌ 僅管理員可操作", false); return; }
        showMsg("⏳ 開啟名單管理...", true);
        setTimeout(() => {
            closeModal();
            document.getElementById("listManagerModal").classList.add("show");
            mAllRecords = [...allRecords];
            mFilteredRecords = [...mAllRecords];
            mCurrentPage = 1;
            mUpdatePagination(); mRenderCurrentPage();
            showMsg("✅ 已開啟名單管理", true);
        }, 300);
    }
    function closeListManager() {
        showMsg("⏳ 關閉中...", true);
        setTimeout(() => { document.getElementById("listManagerModal").classList.remove("show"); showMsg("✅ 已關閉", true); }, 300);
    }
    function refreshManagerList() {
        let btn = document.querySelector(".refresh-top-btn");
        btn.innerText = "⏳ 載入中..."; btn.disabled = true;
        showMsg("⏳ 重新載入名單中...", true);
        loadList();
        setTimeout(() => {
            mAllRecords = [...allRecords]; mFilteredRecords = [...mAllRecords];
            mCurrentPage = 1; mUpdatePagination(); mRenderCurrentPage();
            btn.innerText = "🔄 載入名單"; btn.disabled = false;
            showMsg("✅ 名單已重新載入", true);
        }, 600);
    }

    function mRenderCurrentPage() {
        const start = (mCurrentPage - 1) * mRecordsPerPage;
        renderManagerList(mFilteredRecords.slice(start, start + mRecordsPerPage));
    }
    function mUpdatePagination() {
        mTotalPages = Math.ceil(mFilteredRecords.length / mRecordsPerPage);
        const el = document.getElementById("managerPagination");
        if (mFilteredRecords.length === 0) { el.style.display = "none"; return; }
        el.style.display = "flex";
        document.getElementById("mPageInfo").innerText = `${mCurrentPage} / ${mTotalPages}`;
        document.getElementById("mFirstPage").disabled = mCurrentPage === 1;
        document.getElementById("mPrevPage").disabled = mCurrentPage === 1;
        document.getElementById("mNextPage").disabled = mCurrentPage === mTotalPages;
        document.getElementById("mLastPage").disabled = mCurrentPage === mTotalPages;
    }
    function mChangePage(d) {
        mCurrentPage = Math.max(1, Math.min(mCurrentPage + d, mTotalPages));
        mRenderCurrentPage(); mUpdatePagination();
    }
    function mGoToPage(p) {
        mCurrentPage = Math.max(1, Math.min(p, mTotalPages));
        mRenderCurrentPage(); mUpdatePagination();
    }

    function renderManagerList(records) {
        document.getElementById("managerList").innerHTML = records.length
            ? records.map(row => `
                <div class="item">
                    <span class="name">${row[0]||""}</span>
                    <span class="itemText">：${row[1]||""}</span>
                    <div class="admin-row">
                        <button style="background:linear-gradient(135deg,#2D6A99,#003366)" onclick="managerEdit('${row[0]||""}')">修改</button>
                        <button style="background:linear-gradient(135deg,#D83A56,#cc0000)" onclick="managerDelete('${row[0]||""}')">刪除</button>
                    </div>
                </div>`).join("")
            : "無資料";
    }

    function searchManagerList() {
        const kw = document.getElementById("managerSearch").value.trim().toLowerCase();
        mFilteredRecords = kw
            ? mAllRecords.filter(r => (r[0]||"").toLowerCase().includes(r[1]||"").toLowerCase().includes(kw))
            : [...mAllRecords];
        mCurrentPage = 1; mUpdatePagination(); mRenderCurrentPage();
    }

    async function managerEdit(name) {
        if (!confirm("⚠️ 確定要修改這筆資料嗎？")) return;
        const newItem = prompt("修改項目：", "");
        if (!newItem) return;
        showMsg("⏳ 修改中...", true);
        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ name, item: newItem, userId: currentUserId, displayName: currentDisplayName, signDate: getSignDate() })
            });
            showMsg("✅ 修改完成", true);
            await loadList();
            mAllRecords = [...allRecords]; mFilteredRecords = [...mAllRecords];
            mRenderCurrentPage(); mUpdatePagination();
        } catch (e) {
            showMsg("❌ 修改失敗", false);
        }
    }

    async function managerDelete(name) {
        if (!confirm("⚠️ 確定永久刪除？此動作無法復原！")) return;
        showMsg("⏳ 刪除中...", true);
        try {
            await fetch(WEB_APP_URL, { method: "POST", body: new URLSearchParams({ mode: "delete", name }) });
            showMsg("✅ 刪除成功", true);
            await loadList();
            mAllRecords = [...allRecords]; mFilteredRecords = [...mAllRecords];
            mRenderCurrentPage(); mUpdatePagination();
        } catch (e) {
            showMsg("❌ 刪除失敗", false);
        }
    }

    async function updateSheet2Date() {
        if (!isAdminUser) { showMsg("❌ 僅管理員可操作", false); return; }
        const input = prompt("請輸入新日期（範例：3月16日）", "");
        if (!input) return;
        const year = new Date().getFullYear();
        let month = input.match(/(\d+)月/)?.[1];
        let day = input.match(/(\d+)日/)?.[1];
        if (!month || !day) { showMsg("❌ 格式錯誤，請輸入 3月16日", false); return; }
        const newDate = `${year}/${month}/${day}`;
        showMsg("⏳ 更新日期中...", true);
        try {
            await fetch(WEB_APP_URL, { method: "POST", body: new URLSearchParams({ mode: "updateSheet2Date", newDate }) });
            showMsg(`✅ 日期已更新：${newDate}`, true);
            closeModal();
        } catch (e) {
            showMsg("❌ 更新失敗", false);
        }
    }

    async function clearSheet1() {
        if (!isAdminUser) { showMsg("❌ 僅管理員可操作", false); return; }
        if (!confirm("⚠️ 確定清空『祭改名單』？無法復原！")) return;
        showMsg("⏳ 正在清空所有資料...", true);
        try {
            await fetch(WEB_APP_URL, { method: "POST", body: new URLSearchParams({ mode: "clearSheet1", userId: currentUserId }) });
            showMsg("✅ 已清空所有資料", true);
            await loadList();
            closeModal();
        } catch (e) {
            showMsg("❌ 清空失敗", false);
        }
    }

    function showMsg(text, success) {
        const msg = document.getElementById("msg");
        msg.innerText = text;
        msg.className = "msg " + (success ? "success" : "error");
        msg.style.display = "block";
        setTimeout(() => msg.style.display = "none", 2800);
    }
</script>
