<!DOCTYPE html> 
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彥彬📿 祭改系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }
        body {
            background: #0F0F0F;
            background-image: radial-gradient(circle at 50% 10%, rgba(44,28,20,0.3) 0%, transparent 35%),
                              radial-gradient(circle at 80% 80%, rgba(30,20,15,0.4) 0%, transparent 40%);
            margin: 0;
            padding: 18px;
            max-width: 600px;
            margin: auto;
            position: relative;
            min-height: 100vh;
        }

        .header-card {
            position: relative;
            padding: 32px 20px;
            background: linear-gradient(155deg, #2D2420, #1C1612);
            color: #E0CFC0;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .header-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(224,207,192,0.2), transparent);
        }

        .admin-vertical-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #5C3A37, #4A2C2A);
            color: #E0CFC0;
            border: none;
            border-radius: 10px;
            padding: 6px 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.06), 0 0 12px rgba(224, 207, 192, 0.6);
            z-index: 10;
            white-space: normal;
            line-height: 1.3;
            text-align: center;
            width: auto !important;
            min-width: unset !important;
            max-width: fit-content !important;
            display: none;
            transition: all 0.25s ease;
        }
        .admin-vertical-btn:hover {
            transform: translateY(-50%) scale(1.03);
            box-shadow: 0 3px 10px rgba(0,0,0,0.35), 0 0 12px rgba(224, 207, 192, 0.6);
        }

        .card {
            background: linear-gradient(140deg, #1E1A18, #181411);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
            border: none;
        }
        h2 {
            color: #E0CFC0;
            text-align: center;
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        .title {
            color: #D4B59E;
            font-weight: bold;
            margin-bottom: 14px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        input[type="text"], input:not([type="checkbox"]):not([type="number"]) {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            font-size: 16px;
            margin-bottom: 14px;
            background: rgba(30,26,24,0.6);
            color: #E0E0E0;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        input[type="text"]:focus, input:not([type="checkbox"]):not([type="number"]):focus {
            outline: none;
            border-color: rgba(160,82,77,0.4);
            background: rgba(36,30,28,0.8);
            box-shadow: 0 0 0 3px rgba(160,82,77,0.15);
        }
        input::placeholder {
            color: #777777;
        }

        .collapse-btn {
            background: none;
            border: none;
            color: #D4B59E;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .collapse-btn:hover { color: #E0CFC0; }

        .collapse-content {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .collapse-content.open { max-height: 1200px; }

        /* ===== 項目選擇 + 份數 ===== */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .item-row {
            background: rgba(30,26,24,0.7);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            padding: 10px 12px;
            gap: 10px;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        .item-row:hover {
            background: rgba(44,32,30,0.8);
            border-color: rgba(160,82,77,0.35);
            transform: translateY(-1px);
        }
        .item-row.checked {
            border-color: rgba(160,82,77,0.5);
            background: rgba(50,28,26,0.75);
        }
        .item-row input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin: 0;
            flex-shrink: 0;
            accent-color: #A0524D;
            cursor: pointer;
        }
        .item-label {
            flex: 1;
            font-size: 17px;
            font-weight: 500;
            color: #E0E0E0;
            cursor: pointer;
            user-select: none;
        }

        /* 份數控制器 */
        .qty-control {
            display: flex;
            align-items: center;
            gap: 0;
            opacity: 0.35;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .qty-control.active {
            opacity: 1;
            pointer-events: all;
        }
        .qty-btn {
            width: 32px !important;
            height: 32px !important;
            padding: 0 !important;
            border-radius: 8px !important;
            font-size: 18px !important;
            font-weight: bold;
            background: linear-gradient(135deg, #5C3A37, #4A2C2A) !important;
            color: #E0CFC0 !important;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;
            line-height: 1;
            transition: all 0.15s;
            min-width: unset !important;
            width: fit-content !important;
            letter-spacing: 0;
        }
        .qty-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #B86B5F, #A0524D) !important;
            transform: scale(1.1) !important;
            box-shadow: none !important;
        }
        .qty-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .qty-display {
            min-width: 36px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            color: #FFE44D;
            padding: 0 4px;
            line-height: 32px;
        }
        .qty-unit {
            font-size: 13px;
            color: #A08070;
            margin-left: 2px;
        }

        #customItem {
            margin-top: 12px;
            display: none;
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(30,26,24,0.6);
            color: #E0E0E0;
        }
        #customItem:focus {
            outline: none;
            border-color: rgba(160,82,77,0.4);
        }

        #submitBtn { margin-top: 24px; }

        button {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #B86B5F, #A0524D);
            color: #FFF;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(160,82,77,0.25), 0 0 15px rgba(184, 107, 95, 0.6);
            letter-spacing: 0.5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(160,82,77,0.35), 0 0 15px rgba(184, 107, 95, 0.6);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        button.secondary {
            background: linear-gradient(135deg, #4A6A8C, #3D5A73);
            box-shadow: 0 4px 15px rgba(61,90,115,0.2), 0 0 12px rgba(74, 106, 140, 0.5);
        }
        button.secondary:hover {
            box-shadow: 0 6px 20px rgba(61,90,115,0.28), 0 0 12px rgba(74, 106, 140, 0.5);
        }

        .msg {
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            margin: 14px 0;
            display: none;
            font-weight: bold;
            backdrop-filter: blur(6px);
        }
        .msg.success {
            background: rgba(27,59,41,0.8);
            color: #A8E6CF;
            border: 1px solid rgba(168,230,207,0.15);
        }
        .msg.error {
            background: rgba(59,33,33,0.8);
            color: #FFB3B3;
            border: 1px solid rgba(255,179,179,0.15);
        }

        .list {
            margin-top: 12px;
            overflow: hidden;
            color: #ffffff;
            padding-right: 4px;
        }
        .item {
            padding: 14px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 16px;
            transition: 0.2s;
        }
        .item:hover { background: rgba(255,255,255,0.03); }
        .name {
            color: #FFE44D;
            font-weight: bold;
            font-size: 17px;
        }
        .itemText { color: #8AB4F8; }

        /* ===== 項目統計區 ===== */
        .stats-card {
            background: linear-gradient(140deg, #1E1A18, #181411);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .stat-item {
            background: rgba(30,26,24,0.8);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .stat-item:hover {
            border-color: rgba(160,82,77,0.3);
            background: rgba(44,30,28,0.8);
        }
        .stat-name {
            font-size: 15px;
            color: #D4B59E;
            font-weight: 500;
            text-align: center;
        }
        .stat-count {
            font-size: 28px;
            font-weight: bold;
            color: #FFE44D;
            line-height: 1;
        }
        .stat-unit {
            font-size: 13px;
            color: #A08070;
        }

        .admin-row {
            display: flex;
            margin-top: 10px;
            gap: 8px;
            justify-content: flex-start;
        }
        .admin-row button {
            padding: 5px 10px !important;
            font-size: 14px !important;
            width: fit-content !important;
            flex: unset !important;
            border-radius: 8px;
            white-space: nowrap;
            font-weight: normal;
            transition: all 0.2s ease;
        }
        .admin-row button:hover { transform: scale(1.03); }

        .modal {
            display: none !important;
            position: fixed !important;
            z-index: 9999 !important;
            left: 0 !important; top: 0 !important;
            width: 100% !important; height: 100% !important;
            background-color: rgba(0,0,0,0.85) !important;
            align-items: center !important;
            justify-content: center !important;
            backdrop-filter: blur(6px) !important;
        }
        .modal.show { display: flex !important; }
        .modal-content {
            background: linear-gradient(140deg, #24201D, #1A1613) !important;
            color: #E0E0E0 !important;
            margin: auto !important;
            padding: 32px 28px !important;
            border-radius: 24px !important;
            width: 90% !important;
            max-width: 420px !important;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            position: relative;
        }

        #searchInput { margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08); }

        .refresh-top-btn {
            position: absolute;
            right: 24px; top: 24px;
            background: linear-gradient(135deg, #3D735C, #2D5A43);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            width: fit-content;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 12px;
            background: rgba(25,21,19,0.7);
            border-radius: 16px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .page-btn {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2D2420, #1C1612);
            color: #E0CFC0;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .page-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #B86B5F, #A0524D);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(160,82,77,0.25);
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info {
            min-width: 70px;
            text-align: center;
            color: #D4B59E;
            font-size: 16px;
            font-weight: bold;
            padding: 0 8px;
        }
    </style>
</head>

<body>

    <div class="card header-card">
        <h2>☸️ 祭改報名系統 ☸️</h2>
        <button class="admin-vertical-btn" id="adminBtn" onclick="openModal()">管<br>理</button>
    </div>

    <div class="card">
        <div class="title">報名者姓名</div>
        <input type="text" id="name" placeholder="請輸入姓名">
        
        <div class="title">
            📜 祭改項目（可多選）
            <button class="collapse-btn" onclick="toggleCollapse()">展開：▶</button>
        </div>

        <div class="collapse-content" id="collapseContent">
            <div class="checkbox-group" id="items"></div>
            <input id="customItem" placeholder="✍️ 請輸入其他項目說明">
        </div>

        <button id="submitBtn" onclick="submitSignup()"> 送出報名 </button>
        <div id="msg" class="msg"></div>
    </div>

    <!-- 項目統計卡 -->
    <div class="stats-card" id="statsCard" style="display:none;">
        <div class="title">📊 項目總計統計</div>
        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="card">
        <div class="title">🔍 搜尋姓名 / 項目</div>
        <input type="text" id="searchInput" placeholder="請輸入關鍵字搜尋..." oninput="searchList()">
        
        <div class="pagination" id="pagination" style="display: none;">
            <button class="page-btn" id="firstPage" onclick="goToPage(1)">«</button>
            <button class="page-btn" id="prevPage" onclick="changePage(-1)">‹</button>
            <div class="page-info" id="pageInfo">1 / 1</div>
            <button class="page-btn" id="nextPage" onclick="changePage(1)">›</button>
            <button class="page-btn" id="lastPage" onclick="goToPage(totalPages)">»</button>
        </div>

        <div class="title" style="margin-top:5px;">📋 目前報名名單</div>
        <div id="list" class="list">載入中...</div>
    </div>

    <!-- 管理員彈窗 -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center; margin:0 0 20px 0; color:#E0CFC0;">管理員選單</h3>
            <button class="secondary" onclick="openListManager()">📋 名單管理</button><br><br>
            <button class="secondary" onclick="updateSheet2Date()">📅 修改『祭改日期』</button><br><br>
            <button style="background:linear-gradient(135deg,#D83A56,#cc0000)" onclick="clearSheet1()">🗑️ 清空『祭改名單』</button><br><br>
            <button class="secondary" onclick="closeModal()">關閉</button>
        </div>
    </div>

    <!-- 名單管理彈窗 -->
    <div id="listManagerModal" class="modal">
        <div class="modal-content">
            <button class="refresh-top-btn" onclick="refreshManagerList()">🔄 載入名單</button>
            <h3 style="text-align:center; margin:0 0 16px 0; color:#E0CFC0;">📋 名單管理</h3>
            <input type="text" id="managerSearch" placeholder="🔍 搜尋姓名/項目" oninput="searchManagerList()">
            
            <div class="pagination" id="managerPagination" style="display: none; margin-top:12px;">
                <button class="page-btn" id="mFirstPage" onclick="mGoToPage(1)">«</button>
                <button class="page-btn" id="mPrevPage" onclick="mChangePage(-1)">‹</button>
                <div class="page-info" id="mPageInfo">1 / 1</div>
                <button class="page-btn" id="mNextPage" onclick="mChangePage(1)">›</button>
                <button class="page-btn" id="mLastPage" onclick="mGoToPage(mTotalPages)">»</button>
            </div>

            <div id="managerList" class="list" style="max-height:380px; overflow:auto; margin-top:10px;">載入中...</div>
            <br>
            <button class="secondary" onclick="closeListManager()">關閉</button>
        </div>
    </div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwWIZ3ID5K9PNgSJ20wwMZOiMIQ4dcDGm8M8FIU-u8sRqrzGdomM74OEREGPt2Fgxz8Og/exec";
    
    // 祭改項目清單（不含「其他」，另外處理）
    const WISH_ITEMS = [
        "補財庫", "冤親債主", "歷代祖先",
        "病符", "嬰靈", "陰纏", "祭小人",
        "車關", "倒房", "其他"
    ];

    let currentUserId = "";
    let currentDisplayName = "";
    let allRecords = [];
    let isAdminUser = false;

    // 首頁分頁
    let currentPage = 1;
    const recordsPerPage = 7;
    let totalPages = 1;
    let filteredRecords = [];

    // 名單管理分頁
    let mCurrentPage = 1;
    const mRecordsPerPage = 4;
    let mTotalPages = 1;
    let mFilteredRecords = [];
    let mAllRecords = [];

    // ===== 份數資料 (itemName -> qty) =====
    const itemQty = {};

    window.onload = async function () {
        buildItemRows();
        await initLiffAndGetUser();
        await loadList();
    };

    // ===== 建立項目列（帶份數控制） =====
    function buildItemRows() {
        const box = document.getElementById("items");
        box.innerHTML = "";

        WISH_ITEMS.forEach(itemName => {
            itemQty[itemName] = 1;

            const row = document.createElement("div");
            row.className = "item-row";
            row.dataset.item = itemName;

            // 勾選框
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.value = itemName;
            cb.id = `cb_${itemName}`;

            // 標籤
            const lbl = document.createElement("label");
            lbl.className = "item-label";
            lbl.htmlFor = `cb_${itemName}`;
            lbl.textContent = itemName;

            // 份數控制器
            const qtyCtrl = document.createElement("div");
            qtyCtrl.className = "qty-control";
            qtyCtrl.id = `qty_${itemName}`;

            const minusBtn = document.createElement("button");
            minusBtn.className = "qty-btn";
            minusBtn.textContent = "－";
            minusBtn.type = "button";
            minusBtn.onclick = (e) => { e.stopPropagation(); changeQty(itemName, -1); };

            const display = document.createElement("div");
            display.className = "qty-display";
            display.id = `qd_${itemName}`;
            display.textContent = "1";

            const plusBtn = document.createElement("button");
            plusBtn.className = "qty-btn";
            plusBtn.textContent = "＋";
            plusBtn.type = "button";
            plusBtn.onclick = (e) => { e.stopPropagation(); changeQty(itemName, 1); };

            const unit = document.createElement("span");
            unit.className = "qty-unit";
            unit.textContent = "份";

            qtyCtrl.appendChild(minusBtn);
            qtyCtrl.appendChild(display);
            qtyCtrl.appendChild(plusBtn);
            qtyCtrl.appendChild(unit);

            row.appendChild(cb);
            row.appendChild(lbl);
            row.appendChild(qtyCtrl);

            // 勾選時啟用份數控制
            cb.addEventListener("change", function () {
                row.classList.toggle("checked", this.checked);
                qtyCtrl.classList.toggle("active", this.checked);
                // 其他項目顯示輸入框
                if (itemName === "其他") {
                    document.getElementById("customItem").style.display = this.checked ? "block" : "none";
                }
            });

            box.appendChild(row);
        });
    }

    function changeQty(itemName, delta) {
        itemQty[itemName] = Math.max(1, Math.min(99, (itemQty[itemName] || 1) + delta));
        document.getElementById(`qd_${itemName}`).textContent = itemQty[itemName];
    }

    async function initLiffAndGetUser() {
        try {
            await liff.init({ liffId: "2007416974-JzvPy6DZ" });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const p = await liff.getProfile();
            currentUserId = p.userId || "unknown_user";
            currentDisplayName = p.displayName || "unknown_name";
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ mode: "checkAdmin", userId: currentUserId })
            });
            const data = await res.json();
            isAdminUser = data.isAdmin || false;
            if (isAdminUser) document.getElementById("adminBtn").style.display = "block";
        } catch (e) {
            currentUserId = "error_user";
            currentDisplayName = "error_name";
            isAdminUser = false;
        }
    }

    function toggleCollapse() {
        const content = document.getElementById("collapseContent");
        const btn = document.querySelector(".collapse-btn");
        if (content.classList.contains("open")) {
            content.classList.remove("open");
            btn.innerText = "展開：▶";
        } else {
            content.classList.add("open");
            btn.innerText = "收合：▼";
        }
    }

    function getSignDate() {
        const now = new Date();
        return `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
    }

    function getFullDateTime() {
        const now = new Date();
        let h = now.getHours();
        const m = now.getMinutes(), s = now.getSeconds();
        const p = h >= 12 ? "下午" : "上午";
        if (h > 12) h -= 12;
        if (h === 0) h = 12;
        return `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${p} ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function isUserAlreadySigned(name) {
        return allRecords.some(row => row[0]?.trim() === name.trim() && row[2] === currentUserId);
    }

    // ===== 送出報名（項目帶份數，格式：冤親債主×2、補財庫×1） =====
    async function submitSignup() {
        const btn = document.getElementById("submitBtn");
        const name = document.getElementById("name").value.trim();
        const custom = document.getElementById("customItem").value.trim();
        const checks = document.querySelectorAll(".checkbox-group input[type='checkbox']:checked");

        btn.disabled = true;
        btn.innerText = "⏳ 提交中...";
        showMsg("⏳ 報名中，請稍候…", true);

        let items = Array.from(checks).map(c => c.value);
        const hasOther = items.includes("其他");

        if (hasOther) {
            items = items.filter(i => i !== "其他");
            if (!custom) {
                showMsg("請輸入其他項目", false);
                btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
            }
        }

        if (!name) {
            showMsg("請輸入姓名", false);
            btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
        }
        if (items.length === 0 && !hasOther) {
            showMsg("請選擇項目", false);
            btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
        }
        if (isUserAlreadySigned(name)) {
            showMsg("❌\n此姓名報名過，\n無法重複報名", false);
            btn.disabled = false; btn.innerText = "✅ 送出報名"; return;
        }

        // 組裝帶份數的字串：冤親債主×2、補財庫×1
        let itemParts = items.map(i => {
            const qty = itemQty[i] || 1;
            return qty > 1 ? `${i}×${qty}` : i;
        });
        if (hasOther) {
            const qty = itemQty["其他"] || 1;
            itemParts.push(qty > 1 ? `${custom}×${qty}` : custom);
        }

        try {
            const form = new URLSearchParams();
            form.append("name", name);
            form.append("item", itemParts.join("、"));
            form.append("userId", currentUserId);
            form.append("displayName", currentDisplayName);
            form.append("signDate", getSignDate());
            form.append("submitTime", getFullDateTime());

            const res = await fetch(WEB_APP_URL, { method: "POST", body: form });
            const data = await res.json();

            if (data.success) {
                showMsg("✅ 報名成功", true);
                document.getElementById("name").value = "";
                document.getElementById("customItem").value = "";
                document.querySelectorAll(".checkbox-group input[type='checkbox']").forEach(c => {
                    c.checked = false;
                    const row = c.closest(".item-row");
                    if (row) row.classList.remove("checked");
                    const ctrl = document.getElementById(`qty_${c.value}`);
                    if (ctrl) ctrl.classList.remove("active");
                    itemQty[c.value] = 1;
                    const disp = document.getElementById(`qd_${c.value}`);
                    if (disp) disp.textContent = "1";
                });
                document.getElementById("customItem").style.display = "none";
                await loadList();
            } else {
                showMsg("❌ 失敗：" + (data.message || ""), false);
            }
        } catch (err) {
            showMsg("❌ 連線異常", false);
        } finally {
            btn.disabled = false;
            btn.innerText = "✅ 送出報名";
        }
    }

    // ===== 載入名單 =====
    async function loadList() {
        try {
            const res = await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ mode: "read" })
            });
            const data = await res.json();
            if (!data.success || data.records.length === 0) {
                document.getElementById("list").innerHTML = "目前無報名資料";
                allRecords = []; filteredRecords = [];
                updatePagination();
                renderStats([]);
                return;
            }
            allRecords = data.records;
            allRecords.reverse();
            filteredRecords = [...allRecords];
            currentPage = 1;
            updatePagination();
            renderCurrentPage();
            renderStats(allRecords);
        } catch (err) {
            document.getElementById("list").innerHTML = "目前無報名資料";
            allRecords = []; filteredRecords = [];
            updatePagination();
            renderStats([]);
        }
    }

    // ===== 統計（解析「項目×份數」格式） =====
    function parseItemsFromString(str) {
        // 支援「、」分隔，每項可以是「名稱×N」或「名稱」
        // ×: U+00D7(×)、U+FF38(Ｘ)、半形x、X、*
        const parts = str.split(/[、,，]/);
        const result = [];
        parts.forEach(p => {
            p = p.trim();
            if (!p) return;
            const match = p.match(/^(.+?)[\u00D7\uFF38xX*](\d+)$/);
            if (match) {
                result.push({ name: match[1].trim(), qty: parseInt(match[2], 10) || 1 });
            } else {
                result.push({ name: p, qty: 1 });
            }
        });
        return result;
    }

    function renderStats(records) {
        const statsCard = document.getElementById("statsCard");
        const statsGrid = document.getElementById("statsGrid");

        if (!records || records.length === 0) {
            statsCard.style.display = "none";
            return;
        }

        // 統計各項目的份數總和
        const countMap = {};
        records.forEach(row => {
            const itemStr = row[1] || "";
            const parsed = parseItemsFromString(itemStr);
            parsed.forEach(({ name, qty }) => {
                if (!name) return;
                countMap[name] = (countMap[name] || 0) + qty;
            });
        });

        // 依照 WISH_ITEMS 順序排列，其他的排後面
        const ordered = [];
        WISH_ITEMS.filter(i => i !== "其他").forEach(wi => {
            if (countMap[wi]) ordered.push({ name: wi, count: countMap[wi] });
        });
        // 其餘（自訂項目）
        Object.keys(countMap).forEach(k => {
            if (!WISH_ITEMS.includes(k)) ordered.push({ name: k, count: countMap[k] });
        });
        // 「其他」分類總計（如有殘留）
        if (countMap["其他"]) ordered.push({ name: "其他", count: countMap["其他"] });

        if (ordered.length === 0) {
            statsCard.style.display = "none";
            return;
        }

        statsCard.style.display = "block";
        statsGrid.innerHTML = ordered.map(({ name, count }) => `
            <div class="stat-item">
                <div class="stat-name">${name}</div>
                <div class="stat-count">${count}</div>
                <div class="stat-unit">份</div>
            </div>
        `).join("");
    }

    // ===== 首頁分頁 =====
    function renderCurrentPage() {
        const start = (currentPage - 1) * recordsPerPage;
        renderList(filteredRecords.slice(start, start + recordsPerPage));
    }
    function updatePagination() {
        totalPages = Math.ceil(filteredRecords.length / recordsPerPage);
        const el = document.getElementById("pagination");
        if (filteredRecords.length === 0) { el.style.display = "none"; return; }
        el.style.display = "flex";
        document.getElementById("pageInfo").innerText = `${currentPage} / ${totalPages}`;
        document.getElementById("firstPage").disabled = currentPage === 1;
        document.getElementById("prevPage").disabled = currentPage === 1;
        document.getElementById("nextPage").disabled = currentPage === totalPages;
        document.getElementById("lastPage").disabled = currentPage === totalPages;
    }
    function changePage(d) {
        currentPage = Math.max(1, Math.min(currentPage + d, totalPages));
        renderCurrentPage(); updatePagination();
    }
    function goToPage(p) {
        currentPage = Math.max(1, Math.min(p, totalPages));
        renderCurrentPage(); updatePagination();
    }

    function renderList(records) {
        document.getElementById("list").innerHTML = records.length
            ? records.map(row => `
                <div class="item">
                    <span class="name">${row[0] || ""}</span>
                    <span class="itemText">：${row[1] || ""}</span>
                </div>`).join("")
            : "目前無報名資料";
    }

    function searchList() {
        const kw = document.getElementById("searchInput").value.trim().toLowerCase();
        filteredRecords = kw
            ? allRecords.filter(r => (r[0]||"").toLowerCase().includes(kw) || (r[1]||"").toLowerCase().includes(kw))
            : [...allRecords];
        currentPage = 1; updatePagination(); renderCurrentPage();
    }

    // ===== 彈窗 =====
    function openModal() {
        showMsg("⏳ 開啟管理選單...", true);
        setTimeout(() => { document.getElementById("adminModal").classList.add("show"); showMsg("✅ 已開啟管理選單", true); }, 300);
    }
    function closeModal() {
        showMsg("⏳ 關閉選單中...", true);
        setTimeout(() => { document.getElementById("adminModal").classList.remove("show"); showMsg("✅ 已關閉", true); }, 300);
    }

    function openListManager() {
        if (!isAdminUser) { showMsg("❌ 僅管理員可操作", false); return; }
        showMsg("⏳ 開啟名單管理...", true);
        setTimeout(() => {
            closeModal();
            document.getElementById("listManagerModal").classList.add("show");
            mAllRecords = [...allRecords];
            mFilteredRecords = [...mAllRecords];
            mCurrentPage = 1;
            mUpdatePagination(); mRenderCurrentPage();
            showMsg("✅ 已開啟名單管理", true);
        }, 300);
    }
    function closeListManager() {
        showMsg("⏳ 關閉中...", true);
        setTimeout(() => { document.getElementById("listManagerModal").classList.remove("show"); showMsg("✅ 已關閉", true); }, 300);
    }
    function refreshManagerList() {
        let btn = document.querySelector(".refresh-top-btn");
        btn.innerText = "⏳ 載入中..."; btn.disabled = true;
        showMsg("⏳ 重新載入名單中...", true);
        loadList();
        setTimeout(() => {
            mAllRecords = [...allRecords]; mFilteredRecords = [...mAllRecords];
            mCurrentPage = 1; mUpdatePagination(); mRenderCurrentPage();
            btn.innerText = "🔄 載入名單"; btn.disabled = false;
            showMsg("✅ 名單已重新載入", true);
        }, 600);
    }

    // ===== 名單管理分頁 =====
    function mRenderCurrentPage() {
        const start = (mCurrentPage - 1) * mRecordsPerPage;
        renderManagerList(mFilteredRecords.slice(start, start + mRecordsPerPage));
    }
    function mUpdatePagination() {
        mTotalPages = Math.ceil(mFilteredRecords.length / mRecordsPerPage);
        const el = document.getElementById("managerPagination");
        if (mFilteredRecords.length === 0) { el.style.display = "none"; return; }
        el.style.display = "flex";
        document.getElementById("mPageInfo").innerText = `${mCurrentPage} / ${mTotalPages}`;
        document.getElementById("mFirstPage").disabled = mCurrentPage === 1;
        document.getElementById("mPrevPage").disabled = mCurrentPage === 1;
        document.getElementById("mNextPage").disabled = mCurrentPage === mTotalPages;
        document.getElementById("mLastPage").disabled = mCurrentPage === mTotalPages;
    }
    function mChangePage(d) {
        mCurrentPage = Math.max(1, Math.min(mCurrentPage + d, mTotalPages));
        mRenderCurrentPage(); mUpdatePagination();
    }
    function mGoToPage(p) {
        mCurrentPage = Math.max(1, Math.min(p, mTotalPages));
        mRenderCurrentPage(); mUpdatePagination();
    }

    function renderManagerList(records) {
        document.getElementById("managerList").innerHTML = records.length
            ? records.map(row => `
                <div class="item">
                    <span class="name">${row[0]||""}</span>
                    <span class="itemText">：${row[1]||""}</span>
                    <div class="admin-row">
                        <button style="background:linear-gradient(135deg,#2D6A99,#003366)" onclick="managerEdit('${row[0]||""}')">修改</button>
                        <button style="background:linear-gradient(135deg,#D83A56,#cc0000)" onclick="managerDelete('${row[0]||""}')">刪除</button>
                    </div>
                </div>`).join("")
            : "無資料";
    }

    function searchManagerList() {
        const kw = document.getElementById("managerSearch").value.trim().toLowerCase();
        mFilteredRecords = kw
            ? mAllRecords.filter(r => (r[0]||"").toLowerCase().includes(kw) || (r[1]||"").toLowerCase().includes(kw))
            : [...mAllRecords];
        mCurrentPage = 1; mUpdatePagination(); mRenderCurrentPage();
    }

    async function managerEdit(name) {
        if (!confirm("⚠️ 確定要修改這筆資料嗎？")) return;
        const newItem = prompt("修改項目：", "");
        if (!newItem) return;
        let btns = event.currentTarget;
        btns.disabled = true; btns.innerText = "⏳ 修改中...";
        showMsg("⏳ 修改中...", true);
        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                body: new URLSearchParams({ name, item: newItem, userId: currentUserId, displayName: currentDisplayName, signDate: getSignDate() })
            });
            showMsg("✅ 修改完成", true);
            await loadList();
            mAllRecords = [...allRecords]; mFilteredRecords = [...mAllRecords];
            mRenderCurrentPage(); mUpdatePagination();
        } catch (e) {
            showMsg("❌ 修改失敗", false);
        } finally {
            btns.disabled = false; btns.innerText = "修改";
        }
    }

    async function managerDelete(name) {
        if (!confirm("⚠️ 確定永久刪除？此動作無法復原！")) return;
        let btns = event.currentTarget;
        btns.disabled = true; btns.innerText = "⏳ 刪除中...";
        showMsg("⏳ 刪除中...", true);
        try {
            await fetch(WEB_APP_URL, { method: "POST", body: new URLSearchParams({ mode: "delete", name }) });
            showMsg("✅ 刪除成功", true);
            await loadList();
            mAllRecords = [...allRecords]; mFilteredRecords = [...mAllRecords];
            mRenderCurrentPage(); mUpdatePagination();
        } catch (e) {
            showMsg("❌ 刪除失敗", false);
        } finally {
            btns.disabled = false; btns.innerText = "刪除";
        }
    }

    async function updateSheet2Date() {
        if (!isAdminUser) { showMsg("❌ 僅管理員可操作", false); return; }
        const input = prompt("請輸入新日期（範例：3月16日）", "");
        if (!input) return;
        const year = new Date().getFullYear();
        let month = input.match(/(\d+)月/)?.[1];
        let day = input.match(/(\d+)日/)?.[1];
        if (!month || !day) { showMsg("❌ 格式錯誤，請輸入 3月16日", false); return; }
        const newDate = `${year}/${month}/${day}`;
        let btn = event.currentTarget;
        btn.disabled = true; btn.innerText = "⏳ 更新中...";
        showMsg("⏳ 更新日期中...", true);
        try {
            await fetch(WEB_APP_URL, { method: "POST", body: new URLSearchParams({ mode: "updateSheet2Date", newDate }) });
            showMsg(`✅ 日期已更新：${newDate}`, true);
            closeModal();
        } catch (e) {
            showMsg("❌ 更新失敗", false);
        } finally {
            btn.disabled = false; btn.innerText = "📅 修改『祭改日期』";
        }
    }

    async function clearSheet1() {
        if (!isAdminUser) { showMsg("❌ 僅管理員可操作", false); return; }
        if (!confirm("⚠️ 確定清空『祭改名單』？無法復原！")) return;
        let btn = event.currentTarget;
        btn.disabled = true; btn.innerText = "⏳ 清空中...";
        showMsg("⏳ 正在清空所有資料...", true);
        try {
            await fetch(WEB_APP_URL, { method: "POST", body: new URLSearchParams({ mode: "clearSheet1", userId: currentUserId }) });
            showMsg("✅ 已清空所有資料", true);
            await loadList();
            closeModal();
        } catch (e) {
            showMsg("❌ 清空失敗", false);
        } finally {
            btn.disabled = false; btn.innerText = "🗑️ 清空『祭改名單』";
        }
    }

    function showMsg(text, success) {
        const msg = document.getElementById("msg");
        msg.innerText = text;
        msg.className = "msg " + (success ? "success" : "error");
        msg.style.display = "block";
        setTimeout(() => msg.style.display = "none", 2800);
    }
</script>
